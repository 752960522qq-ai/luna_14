<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>天空决斗</title>
<style>
:root{--cyan:#76e3f7;--gold:#ffcf71;--red:#ff6d70}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#fff;font-family:system-ui,"Noto Sans SC",sans-serif;touch-action:none;user-select:none}canvas{display:block}#scene{position:fixed;inset:0}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,#0209138c 100%)}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;left:3.2%;right:3.2%;top:3%;display:flex;justify-content:space-between;align-items:flex-start}.brand{font-size:clamp(12px,2vw,17px);letter-spacing:.18em;color:#a9bbc9}.brand b{display:block;font-size:clamp(20px,3.2vw,30px);letter-spacing:.06em;color:white}.readout{display:flex;gap:clamp(12px,3vw,34px);text-align:right}.readout label{display:block;font-size:10px;letter-spacing:.18em;color:#8a9eae}.readout strong{font:700 clamp(16px,3vw,25px)/1.2 monospace}.reticle{position:absolute;left:50%;top:46%;width:48px;height:48px;transform:translate(-50%,-50%);opacity:.85}.reticle:before,.reticle:after{content:"";position:absolute;background:#d8f6ff}.reticle:before{width:1px;height:48px;left:23px}.reticle:after{height:1px;width:48px;top:23px}.reticle i{position:absolute;inset:13px;border:1px solid #d8f6ff;border-radius:50%}.bottom-left{position:absolute;left:3.2%;bottom:5%;width:31%;max-width:280px}.bar-label{display:flex;justify-content:space-between;font:11px monospace;color:#bfd1dc;margin:7px 0 4px}.bar{height:5px;background:#ffffff24;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;width:100%;background:linear-gradient(90deg,#46d9ef,#d7faff);transition:width .15s}.bar.health span{background:linear-gradient(90deg,#ff606d,#ffc06d)}.controls{position:absolute;inset:0}.pad{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,clamp(42px,7vw,66px));grid-template-rows:repeat(2,clamp(42px,7vw,66px));gap:6px}.ctrl{pointer-events:auto;border:1px solid #b6d5e544;background:#11243c99;color:#eaf8ff;border-radius:14px;font-size:clamp(18px,3vw,25px);backdrop-filter:blur(8px);touch-action:none}.ctrl:active,.ctrl.on{background:#46c8db99;border-color:#b8fbff}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.action{position:absolute;right:4%;bottom:8%;display:flex;gap:12px;align-items:end}.fire{width:clamp(74px,13vw,112px);height:clamp(74px,13vw,112px);border-radius:50%;border:2px solid #ff9b7899;background:radial-gradient(circle,#ff8658cc,#8c2f356e);font-weight:900;letter-spacing:.12em;color:white;box-shadow:0 0 26px #ff654644}.boost{width:clamp(54px,9vw,75px);height:clamp(54px,9vw,75px);border-radius:50%;border:1px solid #85e7ff77;background:#17435b99;color:#c7f5ff;font-size:12px}.target{position:absolute;right:4%;top:26%;width:clamp(110px,20vw,190px);text-align:right}.target .bar{height:4px}.target small{display:block;color:#ffaaa8;font:11px monospace;letter-spacing:.16em;margin-bottom:5px}.toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);font-size:clamp(14px,2.8vw,23px);letter-spacing:.2em;color:#dbf9ff;text-shadow:0 2px 15px #00c8ff;opacity:0;transition:opacity .3s}.toast.show{opacity:1}.screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(110deg,#07111deb,#081624aa 55%,#09111de8)}.panel{width:min(88vw,670px);padding:clamp(20px,4vw,44px);border:1px solid #a8d8eb33;background:#071524c9;box-shadow:0 20px 90px #0009;backdrop-filter:blur(14px)}.eyebrow{color:#73daed;font-size:11px;letter-spacing:.32em}.panel h1{font-size:clamp(34px,7vw,64px);line-height:1;margin:10px 0 8px;letter-spacing:.06em}.panel p{color:#a8bdcc;font-size:clamp(12px,2vw,15px);line-height:1.7;margin:0 0 22px}.planes{display:flex;gap:10px;margin:18px 0}.plane-option{flex:1;text-align:left;padding:14px;border:1px solid #ffffff2b;background:#102237;color:white;border-radius:4px}.plane-option.active{border-color:var(--cyan);box-shadow:inset 0 0 20px #53cde414}.plane-option b{display:block;font-size:18px}.plane-option span{font-size:11px;color:#9db4c4}.start{width:100%;padding:15px;border:0;background:linear-gradient(100deg,#69d8e9,#a5edee);color:#06202c;font-weight:900;letter-spacing:.23em;font-size:15px}.hint{margin-top:14px!important;font-size:11px!important}.hidden{display:none!important}.damage{animation:flash .2s}@keyframes flash{50%{filter:brightness(2)}}
</style></head><body><div id="scene"></div><div id="vignette"></div>
<div class="hud" id="hud"><div class="top"><div class="brand">FLIGHT SIMULATION<b>天空决斗 / SKY DUEL</b></div><div class="readout"><div><label>速度 IAS</label><strong id="speed">420</strong></div><div><label>高度 ALT</label><strong id="alt">1200</strong></div><div><label>击落 KILLS</label><strong id="kills">00</strong></div></div></div><div class="reticle"><i></i></div><div class="target"><small>敌机 · MiG-15</small><div class="bar health"><span id="enemyHealth"></span></div></div><div class="bottom-left"><div class="bar-label"><span>机体完整度</span><span id="hpText">100%</span></div><div class="bar health"><span id="playerHealth"></span></div><div class="bar-label"><span>机炮弹药</span><span id="ammo">120</span></div><div class="bar"><span id="ammoBar"></span></div></div><div class="toast" id="toast">目标锁定</div><div class="controls"><div class="pad"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="action"><button class="ctrl boost" data-key="boost">加力</button><button class="ctrl fire" data-key="fire">开火</button></div></div></div>
<div class="screen" id="menu"><div class="panel"><div class="eyebrow">1950s JET DOGFIGHT · 3D MOBILE GAME</div><h1>天空决斗</h1><p>越过云层，咬住敌机尾部。驾驶第一代喷气式战斗机，在近距空战中争夺制空权。</p><div class="planes"><button class="plane-option active" data-plane="f86"><b>F-86 佩刀</b><span>更灵活 · 机炮六挺</span></button><button class="plane-option" data-plane="mig15"><b>米格-15</b><span>爬升更快 · 火力更强</span></button></div><button class="start" id="start">进入空域　→</button><p class="hint">触屏方向键操纵飞行 · 按住开火 · 加力追击或脱离</p></div></div><div class="screen hidden" id="end"><div class="panel"><div class="eyebrow">SORTIE COMPLETE</div><h1 id="resultTitle">击落确认</h1><p id="resultCopy">战斗结束。</p><button class="start" id="again">再次升空　→</button></div></div>
<script type="module">
import * as THREE from './three.module.js';
const $=s=>document.querySelector(s), sceneRoot=$('#scene');let scene,camera,renderer,clock,player,enemy,playerPlane='f86',playing=false,ended=false,kills=0,hp=100,eHp=100,ammo=120,boost=100,fireCooldown=0,enemyFire=0,hitFlash=0,worldTime=0;const keys={up:false,down:false,left:false,right:false,fire:false,boost:false};const bullets=[];const clouds=[];const tmp=new THREE.Vector3();
const mat=(color,rough=.65,metal=.1)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,flatShading:true});
function aircraft(isPlayer,type){const root=new THREE.Group();const body=mat(isPlayer?(type==='f86'?0xc7d0d7:0x6f7c85):(Math.random()>.5?0x78969b:0xb5a080),.48,.35),dark=mat(0x263744,.4,.25),glass=new THREE.MeshStandardMaterial({color:0x61bed7,metalness:.45,roughness:.18,transparent:true,opacity:.78}),accent=mat(isPlayer?0x38c8e1:0xe35a45,.5,.18);
function box(parent,m,x,y,z,sx,sy,sz){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);parent.add(o);return o}function wing(parent,m,pts){const g=new THREE.BufferGeometry();const v=[];for(let i=1;i<pts.length-1;i++)v.push(...pts[0],...pts[i],...pts[i+1]);g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.computeVertexNormals();const o=new THREE.Mesh(g,m);o.material.side=THREE.DoubleSide;parent.add(o)}
// Fuselage points toward -Z. Wing sweep differs by aircraft.
const length=type==='mig15'?7.1:7.7;box(root,body,0,0,0,.72,.65,length);const nose= new THREE.Mesh(new THREE.ConeGeometry(.37,1.35,8),body);nose.rotation.x=-Math.PI/2;nose.position.z=-length/2-.35;root.add(nose);
if(type==='f86'){wing(root,body,[[-.34,0,-1.1],[-4.4,0,-.65],[-2.2,0,1.05],[.25,0,1.55]]);wing(root,body,[[.34,0,-1.1],[4.4,0,-.65],[2.2,0,1.05],[-.25,0,1.55]]);}else{wing(root,body,[[-.34,0,-1.2],[-3.8,0,-2.65],[-2.15,0,1.15],[.3,0,1.55]]);wing(root,body,[[.34,0,-1.2],[3.8,0,-2.65],[2.15,0,1.15],[-.3,0,1.55]]);}
wing(root,dark,[[-.28,0,2.2],[-1.65,0,2.9],[-1.45,0,3.45],[.25,0,3.35]]);wing(root,dark,[[.28,0,2.2],[1.65,0,2.9],[1.45,0,3.45],[-.25,0,3.35]]);box(root,body,0,.72,2.8,.16,1.45,.55);const canopy=new THREE.Mesh(new THREE.SphereGeometry(.48,10,7),glass);canopy.scale.set(.75,.68,1.7);canopy.position.set(0,.49,-.75);root.add(canopy);box(root,accent,0,.05,3.72,.33,.3,.45);for(const x of [-.28,.28]){const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.95,6),dark);barrel.rotation.x=Math.PI/2;barrel.position.set(x,-.12,-4);root.add(barrel)}root.userData={speed:type==='mig15'?83:88,type};return root;}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x83b9d1);scene.fog=new THREE.Fog(0x9bbfce,170,620);camera=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,1400);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;sceneRoot.replaceChildren(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdaf5ff,0x596c74,2.3));const sun=new THREE.DirectionalLight(0xffedcf,2.5);sun.position.set(90,150,-70);scene.add(sun);
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(2200,2200,1,1),mat(0x286379,.86,.12));ocean.rotation.x=-Math.PI/2;ocean.position.y=-90;scene.add(ocean);for(let i=0;i<36;i++){const group=new THREE.Group(),m=mat(0xf1f5f0,.95,0);for(let j=0;j<6;j++){const puff=new THREE.Mesh(new THREE.IcosahedronGeometry(5+Math.random()*8,1),m);puff.position.set((Math.random()-.5)*22,(Math.random()-.5)*5,(Math.random()-.5)*20);puff.scale.y=.5;group.add(puff)}group.position.set((Math.random()-.5)*700,20+Math.random()*110,(Math.random()-.5)*900);group.userData.drift=3+Math.random()*8;scene.add(group);clouds.push(group)}
player=aircraft(true,playerPlane);enemy=aircraft(false,'mig15');scene.add(player,enemy);clock=new THREE.Clock();resize();animate();}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function reset(){if(!scene)init();else{playerPlane=$('.plane-option.active').dataset.plane;scene.remove(player,enemy);player=aircraft(true,playerPlane);enemy=aircraft(false,'mig15');scene.add(player,enemy);bullets.forEach(b=>scene.remove(b.mesh));bullets.length=0}
player.position.set(0,60,0);player.rotation.set(0,0,0);enemy.position.set(0,60,-85);enemy.rotation.set(0,Math.PI,0);hp=eHp=100;ammo=120;boost=100;kills=0;ended=false;playing=true;$('#menu').classList.add('hidden');$('#end').classList.add('hidden');$('#hud').classList.remove('hidden');toast('进入战区');clock.getDelta();}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),1300)}
function fire(from,isEnemy){const dir=new THREE.Vector3(0,0,-1).applyQuaternion(from.quaternion);const mesh=new THREE.Mesh(new THREE.SphereGeometry(.18,6,6),new THREE.MeshBasicMaterial({color:isEnemy?0xff664a:0x8af5ff}));mesh.position.copy(from.position).addScaledVector(dir,5);scene.add(mesh);bullets.push({mesh,dir,speed:isEnemy?190:260,life:2.1,enemy:isEnemy})}
function damage(target,n){if(target==='enemy'){eHp=Math.max(0,eHp-n);$('#enemyHealth').style.width=eHp+'%';if(eHp===0){kills++;$('#kills').textContent=String(kills).padStart(2,'0');toast('敌机击落');eHp=100;$('#enemyHealth').style.width='100%';enemy.position.copy(player.position).add(new THREE.Vector3((Math.random()-.5)*100,10+Math.random()*30,-120).applyQuaternion(player.quaternion));enemy.rotation.copy(player.rotation);if(kills>=3)finish(true)}}else{hp=Math.max(0,hp-n);$('#playerHealth').style.width=hp+'%';$('#hpText').textContent=hp+'%';$('#hud').classList.add('damage');setTimeout(()=>$('#hud').classList.remove('damage'),180);if(hp===0)finish(false)}}
function finish(win){playing=false;ended=true;$('#resultTitle').textContent=win?'王牌飞行员':'任务失败';$('#resultCopy').textContent=win?`空战战果：${kills} 架。你已夺取局部制空权。`:`你击落了 ${kills} 架敌机。整备机体，再次出击。`;$('#end').classList.remove('hidden')}
function animate(){requestAnimationFrame(animate);if(!scene)return;const dt=Math.min(clock.getDelta(),.04);worldTime+=dt;if(playing){const turn=.75*dt*(keys.boost?1.08:1);if(keys.left)player.rotation.y+=turn;if(keys.right)player.rotation.y-=turn;if(keys.up)player.rotation.x-=turn;if(keys.down)player.rotation.x+=turn;player.rotation.z=THREE.MathUtils.damp(player.rotation.z,((keys.left?1:0)-(keys.right?1:0))*.58,2.3,dt);player.rotation.x=THREE.MathUtils.clamp(player.rotation.x,-.72,.72);const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);const base=player.userData.speed*(keys.boost&&boost>0?1.5:1);if(keys.boost&&boost>0)boost=Math.max(0,boost-30*dt);else boost=Math.min(100,boost+13*dt);player.position.addScaledVector(forward,base*dt);player.position.y=THREE.MathUtils.clamp(player.position.y,-15,200);if(player.position.y<0)damage('player',5*dt);
// Enemy turns toward the player, weaving slightly, and tries to keep a firing angle.
const toPlayer=tmp.copy(player.position).sub(enemy.position),dist=toPlayer.length();const desired=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,-1),toPlayer.normalize());enemy.quaternion.slerp(desired,Math.min(dt*.48,1));enemy.rotateZ(Math.sin(worldTime*1.8)*dt*.32);enemy.position.addScaledVector(new THREE.Vector3(0,0,-1).applyQuaternion(enemy.quaternion),72*dt);if(dist<230&&Math.random()<dt*.23)fire(enemy,true);fireCooldown-=dt;if(keys.fire&&fireCooldown<=0&&ammo>0){fire(player,false);ammo--;fireCooldown=.11;$('#ammo').textContent=ammo;$('#ammoBar').style.width=(ammo/120*100)+'%'}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.mesh.position.addScaledVector(b.dir,b.speed*dt);b.life-=dt;let hit=false;if(b.enemy){if(b.mesh.position.distanceTo(player.position)<5){damage('player',7);hit=true}}else if(b.mesh.position.distanceTo(enemy.position)<7){damage('enemy',4.5);hit=true}if(hit||b.life<=0){scene.remove(b.mesh);bullets.splice(i,1)}}
// Chase camera eases behind the aircraft and adds small attitude awareness.
const back=new THREE.Vector3(0,5.4,15).applyQuaternion(player.quaternion);camera.position.lerp(tmp.copy(player.position).add(back),1-Math.exp(-4*dt));const look=player.position.clone().addScaledVector(forward,28);look.y+=2;camera.lookAt(look);const speedVal=Math.round(base*4.2);$('#speed').textContent=speedVal;$('#alt').textContent=Math.max(0,Math.round((player.position.y+90)*9))+' m';}else if(player&&camera){const forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);camera.position.lerp(tmp.copy(player.position).add(new THREE.Vector3(0,7,19).applyQuaternion(player.quaternion)),.025);camera.lookAt(player.position.clone().addScaledVector(forward,20))}
clouds.forEach(c=>{c.position.x+=c.userData.drift*dt;if(c.position.x>430)c.position.x=-430});if(renderer)renderer.render(scene,camera)}
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;const down=e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();keys[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch{}},up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
const keyMap={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',' ':'fire',Shift:'boost'};
const setKey=(e,pressed)=>{const k=keyMap[e.key]||keyMap[e.key.toLowerCase()];if(!k)return;e.preventDefault();keys[k]=pressed;document.querySelector(`[data-key="${k}"]`)?.classList.toggle('on',pressed)};
window.addEventListener('keydown',e=>setKey(e,true));window.addEventListener('keyup',e=>setKey(e,false));
document.querySelectorAll('.plane-option').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.plane-option').forEach(n=>n.classList.remove('active'));b.classList.add('active')}));$('#start').addEventListener('click',reset);$('#again').addEventListener('click',reset);window.showPause=()=>{if(playing){playing=false;toast('已暂停 · 点击再次升空继续');$('#again').textContent='继续战斗　→';$('#end').classList.remove('hidden');$('#resultTitle').textContent='任务暂停';$('#resultCopy').textContent='调整呼吸，准备继续空战。'}else if(ended){reset()}};
init();</script></body></html>
