const $=s=>document.querySelector(s), sceneRoot=$('#scene');let scene,camera,renderer,clock,player,enemy,playerPlane='f86',playerTank='t34',gameMode='air',battlefield=null,ocean=null,playing=false,ended=false,kills=0,hp=100,eHp=100,ammo=120,boost=100,fireCooldown=0,enemyFire=0,hitFlash=0,worldTime=0;const keys={up:false,down:false,left:false,right:false,fire:false,boost:false,aimLeft:false,aimRight:false};const bullets=[];const clouds=[];const tmp=new THREE.Vector3();
const mat=(color,rough=.65,metal=.1)=>new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,flatShading:true});
function aircraft(isPlayer,type){const root=new THREE.Group();const mig=type==='mig15';const silver=mat(isPlayer?0xc4cbd0:0x89978f,.42,.52),wingMat=mat(isPlayer?0xd4d8d9:0x9ba69d,.38,.5),dark=mat(0x263640,.38,.38),glass=new THREE.MeshStandardMaterial({color:0x62b8d0,metalness:.38,roughness:.16,transparent:true,opacity:.78}),red=mat(0xb5232c,.42,.18),white=mat(0xf2f1e9,.48,.12),blue=mat(0x243e6e,.45,.22),yellow=mat(0xe4bb27,.42,.2),engine=mat(0x252b30,.55,.45);

function plateXZ(points,material,y,thick=.13){const sh=new THREE.Shape();points.forEach((p,i)=>i?sh.lineTo(p[0],-p[1]):sh.moveTo(p[0],-p[1]));sh.closePath();const geo=new THREE.ExtrudeGeometry(sh,{depth:thick,bevelEnabled:true,bevelSegments:1,steps:1,bevelSize:.025,bevelThickness:.025});geo.rotateX(-Math.PI/2);geo.translate(0,y-thick*.5,0);const mesh=new THREE.Mesh(geo,material);mesh.castShadow=true;mesh.receiveShadow=true;root.add(mesh);return mesh}

function box(m,x,y,z,sx,sy,sz){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);root.add(o);return o}

function starShape(r,inner){const sh=new THREE.Shape();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*inner:r,x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?sh.lineTo(x,y):sh.moveTo(x,y)}sh.closePath();return sh}
function starDecal(x,z,r,y=.11){const geo=new THREE.ShapeGeometry(starShape(r,.43));const o=new THREE.Mesh(geo,red);o.rotation.x=-Math.PI/2;o.position.set(x,y,z);root.add(o)}
fuselage();
const leftWing=mig?[[-.43,-.42],[-4.05,-2.35],[-3.48,-1.18],[-.5,1.55]]:[[-.42,-.52],[-4.45,-2.55],[-3.55,-.58],[-.48,1.92]],rightWing=leftWing.map(p=>[-p[0],p[1]]);

const tailL=[[-.25,2.45],[-1.52,3.1],[-1.38,3.53],[-.22,3.22]],tailR=tailL.map(p=>[-p[0],p[1]]);plateXZ(tailL,wingMat,.12,.11);plateXZ(tailR,wingMat,.12,.11);

const canopy=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),glass);canopy.scale.set(.42,.39,.98);canopy.position.set(0,.49,-1.63);root.add(canopy);
const canopyFrame=mat(0x707c80,.4,.55);box(canopyFrame,0,.74,-1.66,.045,.035,1.55);
const inletRing=new THREE.Mesh(new THREE.TorusGeometry(.43,.075,8,24),mig?red:dark);inletRing.position.set(0,0,-4.22);root.add(inletRing);const inlet=new THREE.Mesh(new THREE.CircleGeometry(.35,20),engine);inlet.position.set(0,0,-4.235);root.add(inlet);box(dark,0,0,-4.25,.035,.34,.06);
const nozzle=new THREE.Mesh(new THREE.CylinderGeometry(.20,.29,.46,14),engine);nozzle.rotation.x=Math.PI/2;nozzle.position.set(0,0,3.92);root.add(nozzle);
for(const side of [-1,1]){const tank=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.92,4,8),mat(0x9ba4a7,.42,.52));tank.rotation.x=Math.PI/2;tank.position.set(side*2.12,-.31,.35);root.add(tank);box(dark,side*2.1,-.12,.35,.09,.32,.12)}
if(mig){starDecal(-2.65,-.08,.34,.095);starDecal(2.65,-.08,.34,.095);plateYZ([[.42,3.0],[1.08,3.43],[1.03,3.58],[.54,3.27]],red,.085,.025)}else{for(const side of [-1,1]){const x=side*2.72;decalCircle(x,-.12,.34,white,.096);decalCircle(x,-.12,.24,blue,.102);decalCircle(x,-.12,.12,white,.108);plateXZ([[side*3.62,-2.02],[side*4.36,-2.42],[side*4.12,-1.75],[side*3.55,-1.25]],yellow,.09,.035)}}
for(const side of [-1,1]){const gun=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.84,6),dark);gun.rotation.x=Math.PI/2;gun.position.set(side*.27,-.12,-3.82);root.add(gun)}
root.userData={speed:mig?83:88,type};return root}
function tank(isPlayer,type){const root=new THREE.Group(),soviet=type==='t34',paint=mat(isPlayer?(soviet?0x657047:0x81764f):(soviet?0x77734f:0x77745e),.82,.12),edge=mat(0x30332b,.9,.08),metal=mat(0x252923,.85,.25),dark=mat(0x171b19,.38,.1),mark=mat(isPlayer?0xd8c879:(soviet?0xb83b32:0xe4e1cf),.62,.18);function box(p,m,x,y,z,a,b,c){const o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);p.add(o);return o}function wheel(p,x,y,z,r){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.22,12),metal);o.rotation.z=Math.PI/2;o.position.set(x,y,z);p.add(o);const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*.33,r*.33,.24,10),paint);hub.rotation.z=Math.PI/2;hub.position.copy(o.position);p.add(hub)}

box(root,edge,0,.55,0,2.65,.72,5.1);box(root,paint,0,1.0,-.35,2.55,.7,4.45);box(root,paint,0,1.28,-1.45,2.35,.48,1.65);box(root,paint,0,1.12,1.58,2.5,.62,1.3);for(const side of [-1,1]){box(root,metal,side*1.36,.53,0,.34,.95,5.15);const count=soviet?5:6;for(let i=0;i<count;i++)wheel(root,side*1.48,.48,-1.8+i*3.6/(count-1),soviet?.43:.35);for(let i=0;i<3;i++)wheel(root,side*1.49,1.06,-1.25+i*1.25,.14)}
