name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate startup screen visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          assert '.hidden{display:none!important}' in html, 'Hidden screen CSS is missing'
          assert 'class="screen" id="menu"' in html, 'Main menu must be visible at startup'
          for screen_id in ('hangar', 'research', 'encyclopedia', 'end'):
              assert f'class="screen hidden" id="{screen_id}"' in html, f'{screen_id} must start hidden'
          assert 'function setCatalogSpecs(type)' in html, 'Catalog spec renderer is missing'
          open_start = html.index('function openCatalog()')
          open_end = html.index('\nfunction closeCatalog()', open_start)
          open_catalog = html[open_start:open_end]
          assert open_catalog.index("showMenuScreen('encyclopedia')") < open_catalog.index('setCatalogSpecs(previewType)'), 'Catalog must switch screens before initializing its specs'
          assert all(token in html for token in ('tech-panel', 'class=\"rank-band\"', 'id=\"researchOwned\"')), 'Ranked tech-tree layout is incomplete'
          audio_dir = Path('app/src/main/assets/audio')
          required_audio = ('jet_engine.mp3', 'b29_engine.mp3', 'f86_gun.mp3', 'b29_gun.mp3', 'mig23_gun.mp3', 'mig37_gun.mp3', 'meteor20_gun.mp3', 'bomb_drop.mp3', 'kill_confirm.mp3')
          assert all((audio_dir / name).is_file() for name in required_audio), 'A referenced aircraft sound asset is missing'
          assert all(token in html for token in ('horizontalTurnRateDps:17.3,verticalTurnRateDps:22', 'horizontalTurnRateDps:15,verticalTurnRateDps:25', 'horizontalTurnRateDps:18,verticalTurnRateDps:20.5', 'horizontalTurnRateDps:4.2,verticalTurnRateDps:5.5')), 'Aircraft turning rates are incomplete'
          assert 'function verticalTurnRateForPlane(type)' in html, 'Vertical turn rates are missing'
          assert 'verticalRateTarget=controls.pitch*verticalTurnRateForPlane(playerPlane)' in html, 'Vertical turn input does not use aircraft-specific rates'
          assert 'function steerAircraftToward(aircraft,targetDirection,dt)' in html and 'data.aiPitchRate=THREE.MathUtils.damp' in html, 'AI steering must respect horizontal and vertical rates'
          assert '水平持续转弯' in html and '垂直瞬时转弯' in html, 'Aircraft turn rates must appear in the catalog'
          assert 'function turnRateForPlane(type,airspeedMps)' in html, 'Published turn time/radius limit is missing'
          assert 'function softLimitRate(value,limit)' in html, 'Progressive turn response is missing'
          assert 'bankTarget=controls.x*bankEnvelope' in html, 'Horizontal joystick must command bank angle'
          assert 'player.userData.velocity.applyAxisAngle(worldUp,turnStep)' in html, 'Bank must turn the flight path with the nose'
          assert 'cameraBankAngle=THREE.MathUtils.damp(cameraBankAngle,flightBankAngle*.55,5,dt)' in html, 'Reduced delayed camera bank is missing'
          assert 'n37:{rpm:400,damage:304,speed:690' in html, 'N-37 muzzle speed is incorrect'
          assert 'ns23:{rpm:550,damage:106,speed:610' in html, 'NS-23 muzzle speed is incorrect'
          assert 'f86:{mg:{rpm:600,damage:34,speed:945' in html, 'M3 muzzle speed is incorrect'
          assert 'meteor:{hispano:{rpm:600,damage:85,speed:880' in html, 'Hispano muzzle speed is incorrect'
          assert 'new THREE.Vector3(0,7/METERS_PER_UNIT,tailDistance)' in html, 'Chase camera 7 m offset is missing'
          assert "tailOffsetMeters=playerPlane==='b29'?7:3" in html, 'Jet fighter chase distance is incorrect'
          assert 'turnDrag=.006*turnLoad*turnLoad' in html, 'Sustained-turn speed loss is missing'
          assert 'maxHeadingStep=turnRateForPlane(data.type,afterForcesSpeed)*dt' not in html, 'Hard flight-path cutoff must stay removed'
          assert 'function updateDroppedBombs(dt)' in html and 'data-key=\"bomb\"' in html, 'B-29 bomb release control is missing'
          print('Startup, catalog, tech tree, audio assets, and flight-dynamics checks passed')
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sky-duel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
