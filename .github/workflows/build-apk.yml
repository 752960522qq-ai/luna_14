name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools'
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate startup screen visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('app/src/main/assets/index.html').read_text()
          assert '.hidden{display:none!important}' in html, 'Hidden screen CSS is missing'
          assert 'class="screen" id="menu"' in html, 'Main menu must be visible at startup'
          for screen_id in ('hangar', 'research', 'encyclopedia', 'end'):
              assert f'class="screen hidden" id="{screen_id}"' in html, f'{screen_id} must start hidden'
          assert 'function setCatalogSpecs(type)' in html, 'Catalog spec renderer is missing'
          open_start = html.index('function openCatalog()')
          open_end = html.index('\nfunction closeCatalog()', open_start)
          open_catalog = html[open_start:open_end]
          assert open_catalog.index("showMenuScreen('encyclopedia')") < open_catalog.index('setCatalogSpecs(previewType)'), 'Catalog must switch screens before initializing its specs'
          assert all(token in html for token in ('tech-panel', 'class=\"rank-band\"', 'id=\"researchOwned\"')), 'Ranked tech-tree layout is incomplete'
          audio_dir = Path('app/src/main/assets/audio')
          required_audio = ('jet_engine.mp3', 'b29_engine.mp3', 'f86_gun.mp3', 'b29_gun.mp3', 'mig23_gun.mp3', 'mig37_gun.mp3', 'meteor20_gun.mp3', 'bomb_drop.mp3', 'kill_confirm.mp3')
          assert all((audio_dir / name).is_file() for name in required_audio), 'A referenced aircraft sound asset is missing'
          assert all(token in html for token in ('horizontalTurnRateDps:17.3,verticalTurnRateDps:22', 'horizontalTurnRateDps:15,verticalTurnRateDps:25', 'horizontalTurnRateDps:18,verticalTurnRateDps:20.5', 'horizontalTurnRateDps:4.2,verticalTurnRateDps:5.5')), 'Aircraft turning rates are incomplete'
          assert 'function verticalTurnRateForPlane(type)' in html, 'Vertical turn rates are missing'
          assert 'pitchTarget=controls.pitch*verticalTurnRateForPlane(playerPlane)' in html, 'Vertical turn input does not use aircraft-specific rates'
          assert 'function steerAircraftToward(aircraft,targetDirection,dt)' in html and 'data.aiPitchRate=THREE.MathUtils.damp' in html, 'AI steering must respect horizontal and vertical rates'
          assert '水平持续转弯' in html and '垂直瞬时转弯' in html, 'Aircraft turn rates must appear in the catalog'
          assert 'function turnRateForPlane(type,airspeedMps)' in html, 'Published turn time/radius limit is missing'
          assert 'function softLimitRate(value,limit)' in html, 'Progressive turn response is missing'
          assert 'bankTarget=controls.roll*bankLimit' in html and 'bankAcceleration=bankError*spring*spring-(data.bankRate||0)*2*spring' in html, 'Horizontal stick must drive a feedback-damped target-bank controller'
          assert 'data.velocity.applyAxisAngle(new THREE.Vector3(0,1,0),turnStep)' in html, 'Coordinated bank must turn the flight path'
          assert 'cameraBankAngle=THREE.MathUtils.damp(cameraBankAngle,getAircraftBankAngle(player)*.55,5,dt)' in html, 'Camera must follow the measured aircraft bank with lag'
          assert 'function getAircraftBankAngle(aircraft)' in html and 'function setAircraftAttitude(aircraft,heading,pitch,bank)' in html, 'Bank must come from the actual aircraft attitude and be recomposed from separate yaw, pitch, and roll'
          assert 'bankError=Math.atan2(Math.sin(bankTarget-actualBank),Math.cos(bankTarget-actualBank))' in html, 'Roll correction must use the current measured bank angle'
          assert 'flightBankAngle' not in html and 'flightBankRate' not in html, 'A stored accumulated bank angle must not drive the flight attitude'
          assert 'function shapeStickVector(x,y)' in html and 'FLIGHT_CONTROL.deadzone' in html, 'Joystick input must use a radial deadzone and preserve diagonal directions'
          assert 'function updatePlayerFlightControls(dt)' in html and 'return advanceAircraft(player,dt)' in html, 'Player movement must use the dedicated flight instructor update'
          assert 'maxBankDegrees:70' in html and 'maxRollRateDps:95' in html, 'Bank demand must stay maneuverable without near-vertical roll inputs'
          assert "joystickInput.x=0;joystickInput.y=0" in html and "['pointerup','pointercancel','lostpointercapture'].forEach(type=>joystick.addEventListener(type,releaseJoystick))" in html, 'Touch release must clear both joystick axes'
          assert 'n37:{rpm:400,damage:304,speed:690' in html, 'N-37 muzzle speed is incorrect'
          assert 'ns23:{rpm:550,damage:106,speed:610' in html, 'NS-23 muzzle speed is incorrect'
          assert 'f86:{mg:{rpm:600,damage:34,speed:945' in html, 'M3 muzzle speed is incorrect'
          assert 'meteor:{hispano:{rpm:600,damage:85,speed:880' in html, 'Hispano muzzle speed is incorrect'
          assert 'new THREE.Vector3(0,7/METERS_PER_UNIT,tailDistance)' in html, 'Chase camera 7 m offset is missing'
          assert "tailOffsetMeters=playerPlane==='b29'?7:3" in html, 'Jet fighter chase distance is incorrect'
          assert 'turnDrag=.006*turnLoad*turnLoad' in html, 'Sustained-turn speed loss is missing'
          assert 'maxHeadingStep=turnRateForPlane(data.type,afterForcesSpeed)*dt' not in html, 'Hard flight-path cutoff must stay removed'
          assert 'function updateDroppedBombs(dt)' in html and 'data-key=\"bomb\"' in html, 'B-29 bomb release control is missing'
          ammo_ui = html[html.index('function updateAmmoUI()'):html.index('\nfunction ', html.index('function updateAmmoUI()'))]
          assert 'updateThrottleUI()' not in ammo_ui, 'Ammo updates must not refresh the throttle UI'
          assert 'if(!isEnemy&&ammoChanged)updateAmmoUI()' in html, 'Regular weapon ammo UI must refresh only after spending ammo'
          assert 'data.bomberArcCheckRemaining=.075' in html, 'B-29 turret firing arcs must be cached at 75 ms intervals'
          assert 'if(!isEnemy&&ammoSpent>0)updateAmmoUI()' in html, 'B-29 ammo UI must refresh only after rounds are spent'
          assert "playSfx('b29Gun',.28)" not in html and 'bomberGunAudio.loop=true' in html, 'B-29 gun sound must use a dedicated looping audio element'
          assert 'function updateBomberGunAudio(dt)' in html and 'bomberGunAudio.volume=bomberGunVolume' in html, 'B-29 gun loop must fade smoothly'
          assert 'function triggerDamageFlash()' in html and 'damageFlashNextAt=now+200' in html, 'Damage flash must be throttled to 200 ms'
          print('Startup, catalog, tech tree, audio assets, and flight-dynamics checks passed')
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sky-duel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
